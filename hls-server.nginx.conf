server {
    listen 3000;

    root /hls;
    autoindex off;

    # Correct MIME types for HLS
    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
        text/vtt                       vtt;
    }

    location / {
        # CORS — allow any origin so browser-based players work
        add_header Access-Control-Allow-Origin  "*"  always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;

        # Prevent caching of manifests so players always get the latest playlist
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Segments can be cached briefly
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=10" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
